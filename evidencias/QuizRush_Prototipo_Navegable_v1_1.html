<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizRush — prototipo navegable</title>
<style>
:root{--page:#E9EBF3;--bg:#F5F6FA;--card:#fff;--bd:#E7E9F7;--tx:#1B1F3B;--tx2:#6B7080;--pri:#4C5FD5;--okb:#DFF5E3;--okl:#34A853;--kob:#FBE1E1;--kol:#E24C4C;--c0:#9A5B13;--c1:#0F6E63;--c2:#3B6D11;--c3:#1F5A99;--c4:#5B43A8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0B0D16;--bg:#12141F;--card:#1C1F2E;--bd:#2B2F45;--tx:#ECEEF8;--tx2:#9AA0B8;--okb:#17382A;--kob:#3B1E22;--c0:#F0B36B;--c1:#5FD3C2;--c2:#9ED36A;--c3:#7DB4F0;--c4:#B7A2F0}}
:root[data-theme="dark"]{--page:#0B0D16;--bg:#12141F;--card:#1C1F2E;--bd:#2B2F45;--tx:#ECEEF8;--tx2:#9AA0B8;--okb:#17382A;--kob:#3B1E22;--c0:#F0B36B;--c1:#5FD3C2;--c2:#9ED36A;--c3:#7DB4F0;--c4:#B7A2F0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ph{position:relative;height:100%;max-width:390px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:430px){.ph{height:min(780px,calc(100% - 40px));margin:20px auto;border-radius:28px;border:1px solid var(--bd)}}
.sc{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font:inherit;font-size:13px;font-weight:500;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:4px 12px;min-height:32px}
.sub{color:var(--tx2);font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:14px;min-height:96px;padding:12px;text-align:left;font:inherit;font-weight:600;cursor:pointer;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));display:flex;flex-direction:column;gap:2px;justify-content:center}
.tile:last-child{grid-column:span 2}
.tile small{font-weight:400;font-size:12px}
.tile span{font-size:24px}
.nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
.nav button{flex:1;min-height:56px;border:0;background:none;font:inherit;font-size:12px;color:var(--tx2);cursor:pointer}
.nav .on{color:var(--pri);font-weight:600}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;padding:0 16px}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--bd)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--pri)}
.q{font-size:19px;font-weight:600;margin:8px 0}
.op{min-height:52px;text-align:left;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;padding:0 14px;cursor:pointer}
.op.ok{background:var(--okb);border-color:var(--okl)}
.op.ko{background:var(--kob);border-color:var(--kol)}
.fb{font-weight:600;font-size:14px;margin:0}
.big{font-size:56px;font-weight:700;color:var(--pri);text-align:center;margin:0}
.c{text-align:center;margin:0}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.ov>div{background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;width:100%}
</style></head>
<body>
<div class="ph" id="app"></div>
<script>
const CATS=[['Historia','🏛️'],['Ciencia','🔬'],['Geografía','🌎'],['Deportes','⚽'],['Cine y música','🎬']];
const D=[`¿En qué año comenzó la Revolución Mexicana?|1910|1810|1857|1921
¿Quién fue el primer presidente de Estados Unidos?|George Washington|Abraham Lincoln|Thomas Jefferson|John Adams
¿En qué año cayó el Muro de Berlín?|1989|1961|1975|1991
¿Qué civilización construyó Machu Picchu?|Los incas|Los mayas|Los aztecas|Los olmecas
¿En qué año llegó Colón a América?|1492|1453|1521|1588
¿Qué imperio fue gobernado por Julio César?|Romano|Persa|Otomano|Egipcio
¿En qué año terminó la Segunda Guerra Mundial?|1945|1939|1918|1950
¿Cuál fue la capital del Imperio azteca?|Tenochtitlan|Cusco|Teotihuacan|Chichén Itzá
¿Quién lanzó el Grito de Dolores en 1810?|Miguel Hidalgo|Benito Juárez|Emiliano Zapata|Porfirio Díaz
¿Qué pueblo antiguo construyó las pirámides de Giza?|Los egipcios|Los griegos|Los romanos|Los persas`,
`¿Qué planeta es el más cercano al Sol?|Mercurio|Venus|Marte|Júpiter
¿Cuál es la fórmula química del agua?|H2O|CO2|O2|NaCl
¿Qué gas necesitan las plantas para la fotosíntesis?|Dióxido de carbono|Oxígeno|Nitrógeno|Helio
¿Cuántos huesos tiene un cuerpo humano adulto?|206|150|300|412
¿Cuál es el planeta más grande del sistema solar?|Júpiter|Saturno|Neptuno|Tierra
¿Qué órgano bombea la sangre?|El corazón|El hígado|Los pulmones|El estómago
¿A qué temperatura hierve el agua al nivel del mar?|100 °C|90 °C|80 °C|120 °C
¿Qué metal es líquido a temperatura ambiente?|Mercurio|Hierro|Aluminio|Cobre
¿Quién propuso la teoría de la relatividad?|Albert Einstein|Isaac Newton|Galileo Galilei|Nikola Tesla
¿Cuántos planetas tiene el sistema solar?|8|9|7|10`,
`¿Cuál es la capital de Australia?|Canberra|Sídney|Melbourne|Perth
¿Cuál es el río más largo de Sudamérica?|El Amazonas|El Orinoco|El Paraná|El Magdalena
¿Cuál es el país más grande del mundo por superficie?|Rusia|Canadá|China|Estados Unidos
¿Cuál es la capital de Japón?|Tokio|Kioto|Osaka|Seúl
¿Qué océano es el más grande?|Pacífico|Atlántico|Índico|Ártico
¿Cuál es la capital de Argentina?|Buenos Aires|Montevideo|Santiago|Lima
¿En qué país está la Torre Eiffel?|Francia|Italia|España|Alemania
¿Cuál es el desierto cálido más grande del mundo?|El Sahara|El Gobi|El Kalahari|El de Atacama
¿Cuál es la capital de Canadá?|Ottawa|Toronto|Vancouver|Montreal
¿Qué cordillera recorre Sudamérica de norte a sur?|Los Andes|Los Alpes|Los Apalaches|El Himalaya`,
`¿Cuántos jugadores por equipo hay en la cancha en un partido de fútbol?|11|9|10|12
¿Qué país ganó el Mundial de Fútbol de 2022?|Argentina|Francia|Brasil|Croacia
¿Cada cuántos años se juega el Mundial de Fútbol?|4|2|3|5
¿Cuántos minutos dura un partido de fútbol en tiempo reglamentario?|90|60|80|100
¿En qué deporte se juega el torneo de Wimbledon?|Tenis|Golf|Críquet|Bádminton
¿Cuántos anillos tiene el símbolo olímpico?|5|4|6|7
¿Qué país ganó el Mundial de Fútbol de 2014?|Alemania|Argentina|Brasil|España
¿Cuántos jugadores de un equipo hay en la cancha en baloncesto?|5|6|7|4
¿Qué selección ha ganado más Mundiales de fútbol masculino?|Brasil|Alemania|Italia|Argentina
¿En qué deporte se anotan touchdowns?|Fútbol americano|Rugby|Béisbol|Baloncesto`,
`¿Quién dirigió la película Titanic (1997)?|James Cameron|Steven Spielberg|Christopher Nolan|Ridley Scott
¿Qué banda británica cantó Hey Jude?|The Beatles|Queen|The Rolling Stones|Pink Floyd
¿Cómo se llama el mago protagonista creado por J. K. Rowling?|Harry Potter|Percy Jackson|Merlín|Gandalf
¿En qué película aparece un pez payaso llamado Nemo?|Buscando a Nemo|Shrek|Moana|Coco
¿Qué instrumento tiene teclas blancas y negras?|El piano|La guitarra|El violín|La batería
¿Quién es conocido como el Rey del Pop?|Michael Jackson|Elvis Presley|Prince|Justin Timberlake
¿Qué película de Pixar trata sobre el Día de Muertos?|Coco|Soul|Up|Valiente
¿Cuántas cuerdas tiene una guitarra estándar?|6|4|5|8
¿Qué cantante colombiana grabó Hips Don't Lie?|Shakira|Karol G|Thalía|Jennifer Lopez
¿Quién dirigió la trilogía de El señor de los anillos?|Peter Jackson|George Lucas|Tim Burton|Guillermo del Toro`];
const S={scr:'home',best:{},vib:true,snd:true,g:null,ask:false};
const app=document.getElementById('app');
const sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function start(c){S.g={c,i:0,pts:0,sel:null,qs:D[c].trim().split('\n').map(l=>{const[q,ok,...w]=l.split('|');return{q,o:sh([ok,...w].map((t,k)=>({t,ok:!k})))}})};S.scr='game'}
const nav=()=>`<nav class='nav'><button data-a='home' class='${S.scr=='home'?'on':''}'>🏠<br>Inicio</button><button data-a='prog' class='${S.scr=='prog'?'on':''}'>📊<br>Progreso</button><button data-a='set' class='${S.scr=='set'?'on':''}'>⚙️<br>Ajustes</button></nav>`;
function view(){
let h='';const g=S.g;
if(S.scr=='home')h=`<div class='top'>QuizRush<span class='chip'>🔥 3 días</span></div><p class='sub'>¿Listo para jugar? Elige una categoría</p><div class='grid'>${CATS.map((c,i)=>`<button class='tile' style='--c:var(--c${i})' data-a='play' data-c='${i}'><span>${c[1]}</span>${c[0]}<small>${S.best[i]!=null?'Mejor: '+S.best[i]+'/10':'Sin jugar'}</small></button>`).join('')}</div>`;
else if(S.scr=='game'){const q=g.qs[g.i],last=g.i==9;h=`<div class='row'><button class='chip' data-a='back'>← Atrás</button><b>Pregunta ${g.i+1} de 10</b><span class='chip'>${g.pts} pts</span></div><div class='bar'><i style='width:${(g.i+(g.sel!=null?1:0))*10}%'></i></div><p class='q'>${q.q}</p>${q.o.map((o,k)=>`<button class='op ${g.sel==null?'':o.ok?'ok':k==g.sel?'ko':''}' data-a='ans' data-k='${k}'>${g.sel!=null&&o.ok?'✓ ':g.sel==k?'✗ ':''}${o.t}</button>`).join('')}${g.sel!=null?`<p class='fb'>${q.o[g.sel].ok?'¡Correcto! +10 pts':'Incorrecto, era '+q.o.find(o=>o.ok).t}</p><button class='btn p' data-a='next'>${last?'Ver resultado':'Siguiente'}</button>`:''}`}
else if(S.scr=='result'){const n=g.pts/10;h=`<p class='sub c'>${CATS[g.c][0]}</p><p class='big'>${n}/10</p><p class='c'>${n*10}% de aciertos</p><p class='c'><span class='chip'>⭐ Mejor puntaje: ${S.best[g.c]}/10</span></p><div style='flex:1'></div><button class='btn p' data-a='play' data-c='${g.c}'>Jugar de nuevo</button><button class='btn' data-a='home'>Volver al inicio</button>`}
else if(S.scr=='prog')h=`<div class='top'>Mi progreso</div><div class='row'><span class='chip'>🔥 Racha: 3 días</span><span class='chip'>Nivel 2</span></div><p class='sub'>Racha y nivel son datos de ejemplo en este prototipo.</p><p class='sub'>Mejor puntaje por categoría</p>${CATS.map((c,i)=>`<div class='row'><span>${c[1]} ${c[0]}</span><b>${S.best[i]!=null?S.best[i]+'/10':'—'}</b></div><div class='bar'><i style='width:${(S.best[i]||0)*10}%'></i></div>`).join('')}`;
else h=`<div class='top'>Ajustes</div><label class='row'><span>Sonido</span><input type='checkbox' data-a='snd' ${S.snd?'checked':''}></label><label class='row'><span>Vibración al responder</span><input type='checkbox' data-a='vib' ${S.vib?'checked':''}></label>`;
app.innerHTML=`<div class='sc'>${h}</div>${S.scr=='game'||S.scr=='result'?'':nav()}${S.ask?`<div class='ov'><div><b>¿Abandonar la partida?</b><button class='btn p' data-a='stay'>Seguir jugando</button><button class='btn' data-a='quit'>Abandonar</button></div></div>`:''}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,g=S.g;
if(a=='play')start(+b.dataset.c);
else if(a=='ans'&&g.sel==null){g.sel=+b.dataset.k;const ok=g.qs[g.i].o[g.sel].ok;if(ok)g.pts+=10;try{if(S.vib&&navigator.vibrate)navigator.vibrate(ok?30:150)}catch(x){}}
else if(a=='next'){if(g.i==9){const n=g.pts/10;if(S.best[g.c]==null||n>S.best[g.c])S.best[g.c]=n;S.scr='result'}else{g.i++;g.sel=null}}
else if(a=='back')S.ask=true;
else if(a=='stay')S.ask=false;
else if(a=='quit'){S.ask=false;S.scr='home'}
else if(a=='home')S.scr='home';
else if(a=='prog')S.scr='prog';
else if(a=='set')S.scr='set';
else if(a=='snd')S.snd=b.checked;
else if(a=='vib')S.vib=b.checked;
view()});
view();
</script>
</body></html>
